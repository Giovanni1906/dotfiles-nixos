# =============================================================================
# HYPRLOCK - PANTALLA DE BLOQUEO (al suspender, desde el menú de apagado o remoto)
# =============================================================================
# Mismo diseño que la pantalla de inicio de sesión: panel a la izquierda sobre el
# fondo desenfocado. Colores, fuente y radio vienen de tema/tema.conf.
# Pensado para 1920x1080: el panel mide 626 px y su centro está 607 px a la
# izquierda del centro de la pantalla (las posiciones "-607, y" lo siguen).

source = ~/dotfiles/config/hypr/tema.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = suave, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, suave
    animation = fadeOut, 1, 4, suave
    animation = inputFieldDots, 1, 2, suave
}

background {
    monitor =
    path = $fondo_pantalla
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
}

# --- PANEL ---
shape {
    monitor =
    size = 626, 1000
    color = $panel
    rounding = $radio
    border_size = $borde
    border_color = $superficie
    position = -607, 0
    halign = center
    valign = center
}

# --- SALUDO, RELOJ Y FECHA ---
label {
    monitor =
    text = Sesión bloqueada
    color = $texto
    font_size = 24
    font_family = $fuente
    position = -607, 360
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $acento
    font_size = 80
    font_family = $fuente ExtraBold
    position = -607, 245
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_MX.UTF-8 date +"%A, %d de %B"
    color = $texto_tenue
    font_size = 16
    font_family = $fuente
    position = -607, 150
    halign = center
    valign = center
}

# --- USUARIO Y CONTRASEÑA ---
shape {
    monitor =
    size = 112, 112
    color = $superficie
    rounding = -1
    border_size = $borde
    border_color = $acento
    position = -607, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = 
    color = $acento
    font_size = 44
    font_family = $fuente
    position = -607, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $texto
    font_size = 18
    font_family = $fuente
    position = -607, -85
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 470, 58
    outline_thickness = $borde
    rounding = $radio
    inner_color = $superficie
    outer_color = $acento
    check_color = $secundario
    fail_color = $urgente
    capslock_color = $aviso
    font_color = $texto
    font_family = $fuente
    fade_on_empty = false
    placeholder_text = Contraseña
    fail_text = Contraseña incorrecta ($ATTEMPTS)
    dots_size = 0.25
    dots_spacing = 0.35
    position = -607, -175
    halign = center
    valign = center
}

label {
    monitor =
    text = Escribe tu contraseña y pulsa Enter
    color = $texto_tenue
    font_size = 13
    font_family = $fuente
    position = -607, -250
    halign = center
    valign = center
}

# --- PIE DEL PANEL ---
label {
    monitor =
    text =   NixOS  ·  $LAYOUT
    color = $texto_tenue
    font_size = 12
    font_family = $fuente
    position = -607, -440
    halign = center
    valign = center
}
