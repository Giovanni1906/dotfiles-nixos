# =============================================================================
# HYPRLAND CONFIGURATION - CLEAN & OPTIMIZED (2026)
# =============================================================================

autogenerated = 0

# --- TEMA (colores, radio, fondo, cursor) ---
# Define colores ($acento, $secundario, $inactivo, $fondo, $panel...), $fuente, $radio,
# $borde, $fondo_pantalla, $cursor, $tamano_cursor e $iconos (también los usa hyprlock.conf).
# Se cambia en tema/tema.conf y se aplica con tema-aplicar.
source = ~/dotfiles/config/hypr/tema.conf

# --- VARIABLES PRINCIPALES ---
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$browser = app.zen_browser.zen

# --- CONFIGURACIÓN DE ENTRADA ---
input {
    kb_layout = latam
    kb_variant =
    kb_model =
    follow_mouse = 1
    sensitivity = 0 # -1.0 a 1.0, 0 significa sin modificación
}

# --- CORRECCIÓN DEL CURSOR ---
env = WLR_NO_HARDWARE_CURSORS,1

cursor {
    inactive_timeout = 0
    hide_on_key_press = false
    no_hardware_cursors = true
}

# --- ARRANQUE AUTOMÁTICO (Servicios esenciales) ---
exec-once = waybar
exec-once = mako
# Bloquea con hyprlock antes de suspender (config/hypr/hypridle.conf). "exec" se repite en
# cada recarga: así arranca aunque se haya instalado con la sesión ya abierta.
exec = pidof hypridle > /dev/null || hypridle
# KDE Connect y demás utilidades del ecosistema
# exec-once = kdeconnect-indicator
exec-once = valent --gapplication-service
exec-once = wl-paste -t text --watch ~/dotfiles/utils/valent-clipboard.sh
exec-once = nm-applet --indicator
# Preferencias del sistema (modo oscuro). dotfiles-tema: adw-gtk3 con los colores del tema
# (lo genera utils/aplicar-tema.sh en ~/.local/share/themes)
exec-once = dconf write /org/gnome/desktop/interface/color-scheme "'prefer-dark'"
exec-once = dconf write /org/gnome/desktop/interface/gtk-theme "'dotfiles-tema'"
exec-once = dconf write /org/gnome/desktop/interface/icon-theme "'$iconos'"
exec-once = dconf write /org/gnome/desktop/interface/cursor-theme "'$cursor'"
exec-once = dconf write /org/gnome/desktop/interface/cursor-size $tamano_cursor
exec-once = hyprctl setcursor $cursor $tamano_cursor
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
# Fondo de pantalla
exec-once = swaybg -i "$fondo_pantalla" -m fill
# Ejucutar agente grafico polkit (para rustdesk)
exec-once = ${pkgs.polkit_gnome}/libexec/polkit-gnome-authentication-agent-1
# Compartir pantalla con AVNC (celular), solo por Tailscale
exec-once = ~/dotfiles/utils/wayvnc-tailscale.sh

# --- DISEÑO Y VENTANAS ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = $borde
    col.active_border = $secundario $acento 45deg # Degradado secundario -> acento
    col.inactive_border = $inactivo
    layout = dwindle
}

decoration {
    rounding = $radio
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# =============================================================================
# ATAJOS DE TECLADO (BINDINGS)
# =============================================================================

# --- CONTROL DE APLICACIONES Y SISTEMA ---
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, M, exec, hyprctl dispatch exit # Cierre de sesión limpio nativo
bind = $mainMod, B, exec, $browser
# Abrir el menú de apagado (Rofi)
bind = $mainMod, X, exec, ~/dotfiles/config/waybar/scripts/powermenu.sh
# Alternar pantalla completa
bind = $mainMod, F, fullscreen, 0
# Mostrar la lista de atajos (fuente: ~/dotfiles/utils/atajos.txt)
bind = $mainMod, F1, exec, ~/dotfiles/utils/atajos.sh
# Elegir el tema (colores, fondo) entre los de ~/dotfiles/tema/temas
bind = $mainMod, F2, exec, ~/dotfiles/utils/elegir-tema.sh

# --- CAPTURA DE PANTALLA MEJORADA (Grim + Slurp) ---
# Nota: agregamos "wl-copy" a la pantalla completa también para máxima comodidad
bind = , Print, exec, grim - | wl-copy && grim ~/Imágenes/CapturasPantalla/$(date +'%Y-%m-%d_%H-%M-%S').png
bind = $mainMod SHIFT, S, exec, sh -c 'grim -g "$(slurp)" - | tee ~/Imágenes/CapturasPantalla/$(date +"%Y-%m-%d_%H-%M-%S").png | wl-copy'

# --- CAMBIO DE VISTA (Mover el foco entre ventanas) ---
# Usando mainMod + Flechas direccionales
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- POSICIÓN DE VENTANAS (Mover ventanas dentro del layout) ---
# Usando mainMod + Shift + Flechas direccionales
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- CAMBIO DE PANTALLAS / WORKSPACES (mainMod + [0-9]) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- MOVER VENTANA A OTRA PANTALLA (mainMod + Shift + [0-9]) ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- SOPORTE PARA MOUSE (Mover y redimensionar arrastrando) ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- ZOOM EN KITTY (CTRL + rueda del ratón) ---
# "bindn" no consume el evento: en las demás apps (navegador, etc.) CTRL + rueda sigue funcionando igual
bindn = CTRL, mouse_down, exec, ~/dotfiles/utils/kitty-zoom.sh +1
bindn = CTRL, mouse_up, exec, ~/dotfiles/utils/kitty-zoom.sh -1

# --- CONFIGURACION DE VENTANAS FLOTANTES ---
# Gestor de volumen (pwvucontrol): flotante, debajo del módulo de volumen de Waybar
windowrule = float 1, match:class ^(com\.saivert\.pwvucontrol)$
windowrule = size 760 450, match:class ^(com\.saivert\.pwvucontrol)$
windowrule = move 1150 50, match:class ^(com\.saivert\.pwvucontrol)$
# Escape lo cierra si tiene el foco; "bindn" deja pasar Escape al resto de apps
bindn = , Escape, exec, hyprctl activewindow | grep -q "class: com.saivert.pwvucontrol" && hyprctl dispatch killactive

# Editor del tema activo (opción "Editar el tema activo" de SUPER + F2)
windowrule = float 1, match:class ^(tema-editor)$
windowrule = size 900 600, match:class ^(tema-editor)$

# Reglas para el gestor de red (nmtui)
# windowrule = float 1, match:class ^(nmtui-manager)$
# windowrule = size 700 500, match:class ^(nmtui-manager)$
# windowrule = move 800 50, match:class ^(pomo-mixer)$

# --- REGLAS DE ESTÉTICA Y COLOR ---
# Aplica una opacidad del 90% cuando esté activa y 80% cuando cambies de foco
windowrule = opacity 0.9 0.8, match:class ^(com\.saivert\.pwvucontrol)$

# Propiedades estéticas actualizadas al nuevo formato (snake_case)
windowrule = no_blur 0, match:class ^(com\.saivert\.pwvucontrol)$


# =============================================================================
# AJUSTES DE ESTA MÁQUINA (monitores, touchpad...): no se versionan
# =============================================================================
# Lo crea init.sh. Va al final para poder sobrescribir cualquier valor de arriba.
source = ~/dotfiles/config/hypr/local.conf
