# =============================================================================
# HYPRLAND CONFIGURATION - CLEAN & OPTIMIZED (2026)
# =============================================================================

autogenerated = 0

# --- VARIABLES PRINCIPALES ---
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$browser = app.zen_browser.zen

# --- CONFIGURACIÓN DE ENTRADA ---
input {
    kb_layout = latam
    kb_variant =
    kb_model =
    follow_mouse = 1
    sensitivity = 0 # -1.0 a 1.0, 0 significa sin modificación
}

# --- ARRANQUE AUTOMÁTICO (Servicios esenciales) ---
exec-once = waybar
exec-once = mako
# KDE Connect y demás utilidades del ecosistema
# exec-once = kdeconnect-indicator
exec-once = valent --gapplication-service
exec-once = wl-paste -t text --watch ~/dotfiles/utils/valent-clipboard.sh
exec-once = nm-applet --indicator
# Preferencias del sistema (modo oscuro)
exec-once = env GTK_THEME="Adwaita-dark" nm-applet --indicator
exec-once = dconf write /org/gnome/desktop/interface/color-scheme "'prefer-dark'"
exec-once = dconf write /org/gnome/desktop/interface/gtk-theme "'Adwaita-dark'"
exec-once = dconf write /org/gnome/desktop/interface/icon-theme "'Adwaita-dark'"
exec-once = dconf write /org/gnome/desktop/interface/cursor-theme "'catppuccin-mocha-sky-cursors'"
exec-once = dconf write /org/gnome/desktop/interface/cursor-size 24
exec-once = hyprctl setcursor catppuccin-mocha-sky-cursors 24
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
# Fondo de pantalla
exec-once = swaybg -i ~/dotfiles/public/background/gojo2.png -m fill
# Ejucutar agente grafico polkit (para rustdesk)
exec-once = ${pkgs.polkit_gnome}/libexec/polkit-gnome-authentication-agent-1

# --- DISEÑO Y VENTANAS ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(cba6f7) rgb(89b4fa) 45deg # Degradado morado/azul Catppuccin
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# =============================================================================
# ATAJOS DE TECLADO (BINDINGS)
# =============================================================================

# --- CONTROL DE APLICACIONES Y SISTEMA ---
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, M, exec, hyprctl dispatch exit # Cierre de sesión limpio nativo
bind = $mainMod, B, exec, $browser

# --- CAPTURA DE PANTALLA MEJORADA (Grim + Slurp) ---
# Nota: agregamos "wl-copy" a la pantalla completa también para máxima comodidad
bind = , Print, exec, grim - | wl-copy && grim ~/Imágenes/$(date +'%Y-%m-%d_%H-%M-%S').png
bind = $mainMod SHIFT, S, exec, sh -c 'grim -g "$(slurp)" - | tee ~/Imágenes/$(date +"%Y-%m-%d_%H-%M-%S").png | wl-copy'

# --- CAMBIO DE VISTA (Mover el foco entre ventanas) ---
# Usando mainMod + Flechas direccionales
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- POSICIÓN DE VENTANAS (Mover ventanas dentro del layout) ---
# Usando mainMod + Shift + Flechas direccionales
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- CAMBIO DE PANTALLAS / WORKSPACES (mainMod + [0-9]) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- MOVER VENTANA A OTRA PANTALLA (mainMod + Shift + [0-9]) ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- SOPORTE PARA MOUSE (Mover y redimensionar arrastrando) ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- CONFIGURACION DE VENTANAS FLOTANTES ---
# Hace que el mezclador de audio de Kitty flote, sea pequeño y se posicione arriba
windowrule = float 1, match:class ^(pomo-mixer)$
windowrule = size 600 300, match:class ^(pomo-mixer)$
windowrule = move 700 50, match:class ^(pomo-mixer)$

# Reglas para el gestor de red (nmtui)
# windowrule = float 1, match:class ^(nmtui-manager)$
# windowrule = size 700 500, match:class ^(nmtui-manager)$
# windowrule = move 800 50, match:class ^(pomo-mixer)$

# --- REGLAS DE ESTÉTICA Y COLOR ---
# Aplica una opacidad del 85% cuando esté activa y 75% cuando cambies de foco
windowrule = opacity 0.85 0.75, match:class ^(pomo-mixer)$

# Propiedades estéticas actualizadas al nuevo formato (snake_case)
windowrule = no_blur 0, match:class ^(pomo-mixer)$

