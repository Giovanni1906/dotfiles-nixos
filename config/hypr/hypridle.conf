# =============================================================================
# HYPRIDLE - BLOQUEO AL SUSPENDER
# =============================================================================
# Bloquea con hyprlock antes de cualquier suspensión (menú de apagado, login,
# systemctl suspend) y enciende la pantalla al volver. No apaga ni suspende
# por inactividad: para eso se añadirían bloques "listener".

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}
