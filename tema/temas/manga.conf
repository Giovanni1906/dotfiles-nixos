# Tema Manga. Descripción de cada variable en tema/temas/nova.conf.
NOMBRE="Manga"
DESCRIPCION="Plomo y negro sin distracciones — modo enfoque"

# --- COLORES (#RRGGBB) ---
ACENTO="#a0a0a0"        # Gris claro — acento sutil, no llama la atención
SECUNDARIO="#606060"    # Gris medio oscuro
FONDO="#0a0a0a"         # Negro casi puro
SUPERFICIE="#141414"    # Negro con matiz para paneles
TEXTO="#c8c8c8"         # Gris claro legible
TEXTO_TENUE="#484848"   # Gris muy apagado para lo secundario
INACTIVO="#252525"      # Borde de ventanas sin foco — casi invisible
URGENTE="#b04040"       # Rojo apagado para alertas
EXITO="#507850"         # Verde apagado para confirmaciones
AVISO="#786040"         # Ámbar apagado para advertencias
INFO="#407080"          # Azul apagado para info

# --- TRANSPARENCIAS ---
OPACIDAD_PANEL="0.88"      # Panel semisólido para no distraer con el fondo
OPACIDAD_MENU="0.97"       # Menús casi opacos — máximo foco
OPACIDAD_TERMINAL="0.94"   # Terminal casi opaca

# --- FORMA (px) ---
RADIO="6"    # Esquinas poco redondeadas — look más austero
BORDE="1"    # Borde delgado — mínimo peso visual

# --- TIPOGRAFÍA ---
FUENTE="JetBrainsMono Nerd Font"
FUENTE_TAMANO="11"

# --- FONDO DE PANTALLA, CURSOR, ICONOS Y LOGO ---
FONDO_PANTALLA="public/background/manga-dark.jpg"
CURSOR="Bibata-Modern-Classic"
CURSOR_TAMANO="24"
ICONOS="Papirus-Dark"
COLOR_CARPETAS="grey"
LOGO_FASTFETCH="public/png/blue_extorsist_blue.png"

# --- MODO ENFOQUE ---
ESCALA_GRISES="1"   # Fuerza toda la pantalla a escala de grises vía shader GLSL del compositor
