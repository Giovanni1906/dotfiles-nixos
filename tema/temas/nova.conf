# =============================================================================
# TEMA NOVA (por defecto). Referencia comentada de todas las variables.
# =============================================================================
# Cada archivo de tema/temas/ es un tema completo. tema/tema.conf es un enlace
# local (no versionado) al tema elegido en esta máquina: SUPER + F2 lo cambia.
#
# Lo leen dos programas, por eso el formato es el que entienden ambos
# (bash con `source` y Nix con `builtins.fromTOML`):
#   NOMBRE="valor"  ->  sin espacios alrededor del "=", sin "$" ni comillas simples.
#
#   - utils/aplicar-tema.sh   -> Hyprland y su bloqueo (hyprlock), Waybar, Kitty, Rofi,
#                                Mako, GTK y cursor (escribe los archivos tema.* de config/).
#   - nixos/modulos/tema.nix  -> GRUB y pantalla de inicio de sesión (nwg-hello).
#
# Para crear un tema: copiar este archivo en tema/temas/<nombre>.conf y cambiar los valores.
# Editar el tema activo: tema-config, luego tema-aplicar (escritorio) y nix-switch (GRUB y login).

NOMBRE="Nova"
DESCRIPCION="Azul marino con acento celeste"

# --- COLORES (#RRGGBB) ---
ACENTO="#3399cc"        # Principal: texto de Waybar, bordes, selección, reloj
SECUNDARIO="#cba6f7"    # Inicio del degradado del borde de ventanas, verificando contraseña en el bloqueo
FONDO="#0a1e3c"         # Fondo oscuro: terminal, menús, notificaciones, login, GRUB
SUPERFICIE="#133e7c"    # Fondo de módulos y paneles (se usa con transparencia)
TEXTO="#cdd6f4"         # Texto claro
TEXTO_TENUE="#6c7086"   # Texto secundario e inactivo
INACTIVO="#595959"      # Borde de ventanas sin foco
URGENTE="#f38ba8"       # Errores y alertas
EXITO="#a6e3a1"         # Confirmaciones (descanso del Pomodoro)
AVISO="#f9e2af"         # Advertencias
INFO="#89dceb"          # Información (cian de la terminal)

# --- TRANSPARENCIAS (0.0 transparente a 1.0 sólido) ---
OPACIDAD_PANEL="0.70"     # Módulos de Waybar y panel del login
OPACIDAD_MENU="0.95"      # Rofi y notificaciones
OPACIDAD_TERMINAL="0.85"  # Kitty

# --- FORMA (px) ---
RADIO="10"   # Esquinas redondeadas
BORDE="2"    # Grosor del borde de ventanas y menús

# --- TIPOGRAFÍA (debe estar en fonts.packages de nixos/modulos/escritorio.nix) ---
FUENTE="JetBrainsMono Nerd Font"
FUENTE_TAMANO="11"

# --- FONDO DE PANTALLA, CURSOR E ICONOS ---
# CURSOR e ICONOS son nombres de temas instalados (systemPackages de nixos/modulos/escritorio.nix).
FONDO_PANTALLA="public/background/gojo2.png"   # Relativo a la raíz del repo
CURSOR="catppuccin-mocha-sky-cursors"
CURSOR_TAMANO="24"
ICONOS="Papirus-Dark"
COLOR_CARPETAS="blue"     # Color de las carpetas (solo Papirus): adwaita black blue bluegrey breeze brown
                         # carmine cyan darkcyan deeporange green grey indigo magenta nordic orange
                         # palebrown paleorange pink red teal violet white yaru yellow
